name: poc-crawler

services:
  postgres:
    image: postgres:18.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: poc_crawler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - default_toast_compression=lz4
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d poc_crawler"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-test:
    image: postgres:18.0-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: poc_crawler_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
      - -c
      - default_toast_compression=lz4
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d poc_crawler_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
