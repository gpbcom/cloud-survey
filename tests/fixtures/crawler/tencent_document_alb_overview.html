<!DOCTYPE html><html><head><meta charset="utf-8"><title>Overview</title><meta name="description" content="Tencent is a leading influencer in industries such as social media, mobile payments, online video, games, music, and more. Leverage Tencent's vast ecosystem of key products across various verticals as well as its extensive expertise and networks to gain a competitive edge and make your own impact in these industries."></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"TDK": {"title": "Overview", "description": "", "keywords": ""}, "detailContent": {"title": "Overview", "description": "", "keyword": "", "slate": "[{\"children\": [{\"text\": \"What Is ALB?\"}], \"type\": \"h2\", \"id\": \"u2QkCLaRDcSK-SYMJ8JhF\", \"nodeId\": \"3098a7e5-8c55-475d-8756-c94fcd7f1b9a\"}, {\"children\": [{\"text\": \"Application Load Balancer (ALB) is a layer-7 (application layer) load balancing service designed specifically for traffic distribution and routing management for application protocols such as HTTP, HTTPS, and QUIC. It operates at layer 7, the application layer, of the Open Systems Interconnection (OSI) model. This enables it to parse the content of protocols such as HTTP/HTTPS/QUIC and intelligently distribute traffic to different backend services based on request characteristics such as the domain name, path, and Header.\"}], \"type\": \"p\", \"id\": \"fnPCXx12pV9Hd0S5f8m-o\"}, {\"type\": \"p\", \"children\": [{\"text\": \"ALB is a next-generation load balancing solution designed for modern application architectures. It is particularly well-suited for cloud-native scenarios such as microservices, containerization, and Serverless, as well as for business systems that require fine-grained management of HTTP traffic.\"}], \"id\": \"Fqye0RB9Cpd3SMK83r0xK\"}, {\"children\": [{\"text\": \"Features\"}], \"type\": \"h2\", \"id\": \"Dx3t7k9jgMrI5cw_2zoaF\", \"nodeId\": \"0021a5c7-c2f4-4792-b6ef-05d8055058e0\"}]"}}}, "page": "/product/[catalogueId]/[pageId]"}</script></body></html>
