# The unified taxonomy of the cloud catalogue products and of the marketplace software: domains, then categories.
#
# It is the seed of the `taxonomy_nodes` table (see `storage.repositories.taxonomy`): the database is the source of
# truth, edited in the Categories manager, and a node edited there is never overwritten by this file.
#
# Every node has a slug (kebab-case, unique across domains and categories, never changed), English, Russian and Chinese
# names, a one-line English description (shown in the pickers and given to the language model) and the audiences of its
# items (`developer-tool`, `end-user-software`). A category inherits the audiences of its domain unless it names its own.
# `umbrella` marks the generic category of a domain, dropped next to a more specific one of the same domain.
# An item may belong to several categories, of several domains.
#
# `unclassified > other` is the last resort, when neither the source labels, the rules, the delivery method nor the
# language model give a category: it is hidden from the pickers by default.

