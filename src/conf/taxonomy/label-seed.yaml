# Seed of the source labels: the categories of the providers which are not in English (or are noise), with their
# English name and the taxonomy nodes (categories, or a domain only) they file their items under.
#
# - `text` is matched by its normalized key (case, spacing, punctuation, plurals and Latin look-alikes ignored).
# - `en` is the English name: the labels sharing an English name are aliases ("Базы данных" counts with "Databases").
# - `links` are taxonomy slugs (see taxonomy.yaml); a domain slug files the items in the domain only.
# - `same_as` makes the label an alias of another one (its text), `noise: true` marks a tab, a vendor or "Other".
# The seed never overwrites what a person changed in the Categories manager. Apply it with `uv run migrate-db seed`.

