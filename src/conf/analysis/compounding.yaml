# The scope and the curated inputs of the service-compounding analysis (Analysis tab, "Service compounding" section,
# and `render-compounding-doc`). The models are described in `docs/analysis/service-capability-compounding.md`.
#
# providers: the public-cloud providers analysed, each with the year its public cloud started (`start`, optional).
#   A product dated before the start is counted as held at the start, not as a launch (Azure dates some of its
#   on-premises products from the 1990s). Without a start, the first dated product opens the window.
#   - provider: the catalogue provider (`CloudProvider` value).
#     start: the first year of the public cloud ("YYYY"), with its `source`.
# excluded: the providers with dated launches left out of the main fits, each with its reason. They are fitted apart
#   and flagged.
# domains: the taxonomy domains of the cloud computing market kept. The end-user software domains, the professional
#   services and `unclassified` are left out.
# market: yearly sizes of the worldwide cloud infrastructure services market (billion USD), used only for a year the
#   Synergy crawl gives no figure for. Every value needs its source.
# foundations: for a dependent category, the categories its services are built on (the foundation set R_s of the
#   hazard model), every link with the document that shows it.
# settings: how the models are fitted.

providers:
  - {provider: amazon-web-services, start: "2006", source: "https://techcrunch.com/2016/07/02/andy-jassys-brief-history-of-the-genesis-of-aws/"}
  - {provider: microsoft-azure, start: "2010", source: "https://en.wikipedia.org/wiki/Microsoft_Azure"}
  - {provider: google-cloud-platform, start: "2008", source: "https://en.wikipedia.org/wiki/Google_Cloud_Platform"}
  - {provider: oracle-cloud, start: "2016", source: "https://en.wikipedia.org/wiki/Oracle_Cloud"}
  - {provider: huawei-cloud}
  - {provider: scaleway, start: "2015", source: "https://www.scaleway.com/about-us"}
  - {provider: stackit}
  - {provider: exoscale, start: "2013", source: "https://blog.equinix.com/blog/2022/06/01/an-alternative-platform-for-cloud-native-applications/"}

excluded:
  - {provider: china-telecom-cloud, reason: "A telecom operator's cloud serving mostly the Chinese state market, not a public-cloud business competing worldwide."}

domains:
  - compute
  - containers-kubernetes
  - operating-systems
  - virtualization-private-cloud
  - storage-services
  - backup-resilience
  - networking-services
  - domains-web-hosting
  - databases
  - data-analytics
  - application-integration
  - ai-machine-learning
  - security-services
  - identity-access
  - developer-tools
  - devops-automation
  - management-observability
  - iot-edge
  - emerging-technologies

market: []

