statements:
  - product: 'Auto Scaling'
    model: free
    reason: 'AS is free. Only the instances it adds to an AS group are billed, at the ECS price.'
    source: 'https://support.huaweicloud.com/intl/en-us/as_faq/faq_440.html'
  - product: 'Identity and Access Management (IAM)'
    model: free
    reason: 'IAM is free of charge. You pay only for the cloud resources in your account.'
    source: 'https://support.huaweicloud.com/intl/en-us/productdesc-iam/iam_01_0026.html'
  - product: 'Domain Name Service (DNS)'
    model: free
    reason: 'The DNS FAQ states that DNS is a free service.'
    source: 'https://support.huaweicloud.com/intl/en-us/dns_faq/dns_faq_006.html'
  - product: 'Server Migration Service (SMS)'
    model: free
    reason: 'SMS is free. Only the temporary disks and target servers used by a migration are billed.'
    source: 'https://support.huaweicloud.com/intl/en-us/sms_faq/sms_faq_0010.html'
  - product: 'SoftWare Repository for Container (SWR)'
    model: free
    reason: 'The SWR FAQ states SWR is currently free, its storage and traffic billing items included.'
    source: 'https://support.huaweicloud.com/eu/swr_faq/swr_faq_1001.html'
  - product: 'Tag Management Service'
    model: free
    reason: 'The TMS service overview states that TMS is free of charge.'
    source: 'https://support.huaweicloud.com/intl/en-us/productdesc-tms/Tag%20Management%20Service%20Service%20Overview-pdf.pdf'
  - product: 'Cloud Trace Service (CTS)'
    model: free
    reason: 'The product page states that CTS itself is free. Trace storage in OBS is billed by OBS.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/cts.html'
  - product: 'Organizations'
    model: free
    reason: 'The product page lists Organizations as free.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/organizations.html'
  - product: 'Resource Access Manager (RAM)'
    model: free
    reason: 'The product page lists RAM as free.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/ram.html'
  - product: 'Image Management Service (IMS)'
    model: free
    reason: 'The product page offers free image creation. Image storage and the servers built from images are billed by their own services.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/ims.html'
  - product: 'Optimization Advisor (OA)'
    model: free
    reason: 'The product page states OA is free during its open beta test.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/oa.html'
  - product: 'ICP Filing'
    model: free
    reason: 'ICP filing is a free service of Huawei Cloud for websites hosted on its servers in the Chinese Mainland.'
    source: 'https://support.huaweicloud.com/intl/en-us/icp/index.html'
  - product: 'Koo Command Line Interface'
    model: free
    reason: 'KooCLI is a downloadable command line tool for the cloud APIs with no charge of its own.'
    source: 'https://support.huaweicloud.com/intl/en-us/hcli/index.html'
  - product: 'Distributed Message Service (DMS)'
    model: included
    reason: 'Umbrella of DMS for Kafka, RabbitMQ and RocketMQ, each priced separately on the calculator.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/dms.html'
  - product: 'CodeArts Req'
    model: included
    reason: 'Part of the CodeArts editions (Basic, Pro, Enterprise), priced on the calculator as CodeArts packages.'
    source: 'https://www.huaweicloud.com/intl/en-us/product/projectman.html'
  - product: 'Cloud Server Backup Service (CSBS)'
    model: not-public
    reason: 'Not on the public price calculator. CSBS has been superseded by Cloud Backup and Recovery (CBR), which is priced.'
