# Curated price coverage of Huawei Cloud (read by `analytics.prices.coverage_catalog_reader.CoverageCatalogReader`).
provider: huawei-cloud
currency: USD
row_links:
  'RDS for MySQL': ['^Relational Database Service \| rds/[^/|]*/[^/|]*/rds\.mysql\.']
  'RDS for PostgreSQL': ['^Relational Database Service \| rds/[^/|]*/[^/|]*/rds\.pg\.']
  'GPU Accelerated Cloud Server (GACS)': ['^Elastic Cloud Server \|.*Type:GPU-accelerated']
  'CodeArts Agent': ['^CodeArts \| [^|]*codearts\.agent\.']
  'CodeArts Build': ['^CodeArts \| [^|]*devcloud\.cloudbuild\.']
  'CodeArts Check': ['^CodeArts \| [^|]*(devcloud\.codecheck\.|codearts\.extension\.concurrency\.check)']
  'CodeArts Deploy': ['^CodeArts \| [^|]*codearts\.extension\.concurrency\.deploy']
  'CodeArts Pipeline': ['^CodeArts \| [^|]*codearts\.extension\.(concurrency|duration)\.pipeline']
  'CodeArts Artifact': ['^CodeArts \| [^|]*codearts\.extension\.(storage|flow)\.artifact']
  'CodeArts Repo': ['^CodeArts \| [^|]*codearts\.extension\.storage\.repo']
  'CodeArts TestPlan': ['^CodeArts \| [^|]*codearts\.extension\.concurrency\.apitest']
  'Data Lake Factory': ['^DataArts Studio \| [^|]*package\.scheduler\.']
  'Short Sentence Recognition': ['^Speech Interaction Service \| [^|]*sis\.asr\.general']
links:
  'Distributed Cache Service (DCS)': ['^DCS \(for Redis\)$']
  'Distributed Cache Service (DCS) for Memcached': ['^DCS \(for Memcached\)$']
  'Distributed Message Service (DMS) for Kafka': ['^DMS \(for Kafka\)$']
  'Distributed Message Service (DMS) for RabbitMQ': ['^DMS \(for RabbitMQ\)$']
  'Distributed Message Service (DMS) for RocketMQ': ['^DMS \(for RocketMQ\)$']
