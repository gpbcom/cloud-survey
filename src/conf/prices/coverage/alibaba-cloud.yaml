# Curated price coverage of Alibaba Cloud (read by `analytics.prices.coverage_catalog_reader.CoverageCatalogReader`).
provider: alibaba-cloud
currency: USD
row_links:
  'ECS Bare Metal Instance': ['^Elastic Compute Service \| instances/[^|]*/ecs\.ebm']
  'Elastic GPU Service': ['^Elastic Compute Service \| instances/[^|]*/ecs\.(gn|vgn|sgn)[0-9]']
  'Super Computing Cluster': ['^Elastic Compute Service \| instances/[^|]*/ecs\.scc']
  'Elastic Block Storage (EBS)': ['^Elastic Compute Service \| disks/']
links:
  'ApsaraVideo Media Processing (MPS)': ['^ApsaraVideo for Media Processing$']
  'Data Security Center (Original SDDP)': ['^Sensitive Data Discovery & Protection$']
  'Cloud Backup': ['^Hybrid Backup Recovery$']
  'Simple Message Queue (formerly MNS)': ['^Message Service$']
  'ApsaraMQ for RocketMQ': ['^AlibabaMQ for Apache RocketMQ$']
  'Cloud Hardware Security Module (HSM)': ['^Data Encryption Service$']
statements:
  - product: 'Auto Scaling'
    model: free
    reason: 'Auto Scaling itself is free. Only the ECS, ECI, SLB and other resources it manages are billed.'
    source: 'https://www.alibabacloud.com/help/en/auto-scaling/product-overview/billing-rules'
  - product: 'Server Migration Center'
    model: free
    reason: 'SMC itself is free. The intermediate ECS instances, disks and snapshots of a migration are billed by ECS.'
    source: 'https://www.alibabacloud.com/help/en/smc/user-guide/server-migration-guidelines'
  - product: 'Resource Orchestration Service (ROS)'
    model: free
    reason: 'ROS is free of charge. Only the resources created by its templates are billed.'
    source: 'https://www.alibabacloud.com/help/en/ros/product-overview/billing-overview'
  - product: 'CloudOps Orchestration Service'
    model: free
    reason: 'OOS is free of charge. Resources its templates create, such as ECS snapshots, are billed by their services.'
    source: 'https://www.alibabacloud.com/help/en/oos/product-overview/introduction-to-oos'
  - product: 'Resource Management'
    model: free
    reason: 'Resource Directory, Resource Group, Resource Sharing, Tag and Resource Center are free. Only the products used through them are billed.'
    source: 'https://www.alibabacloud.com/help/en/resource-management/product-overview/billing-methods'
  - product: 'ActionTrail'
    model: free
    reason: 'ActionTrail charges nothing itself. Delivering events to Simple Log Service, OSS or MaxCompute bills those services.'
    source: 'https://www.alibabacloud.com/help/en/actiontrail/product-overview/billing-1'
  - product: 'Alibaba Cloud Linux'
    model: free
    reason: 'Alibaba Cloud Linux public images are free of charge, except the Alibaba Cloud Linux 3 Pro edition.'
    source: 'https://www.alibabacloud.com/help/en/ecs/user-guide/alibaba-cloud-linux'
  - product: 'Resource Access Management (RAM)'
    model: free
    reason: 'The product page states RAM is offered at no additional cost.'
    source: 'https://www.alibabacloud.com/product/ram'
  - product: 'Virtual Private Cloud (VPC)'
    model: free
    reason: 'The product page lists VPC as free of charge.'
    source: 'https://www.alibabacloud.com/product/vpc'
  - product: 'Anti-DDoS Basic'
    model: free
    reason: 'The product page states Anti-DDoS Basic is available to all Alibaba Cloud users without any investment.'
    source: 'https://www.alibabacloud.com/en/product/anti-ddos'
  - product: 'Backup and Disaster Recovery Center（BDRC）'
    model: free
    reason: 'The product page states BDRC is free to use. Snapshots or Cloud Backup it may recommend are billed separately.'
    source: 'https://www.alibabacloud.com/product/bdrc'
  - product: 'Cloud Shell'
    model: free
    reason: 'The product page states the Linux virtual machine assigned by Cloud Shell is free of charge.'
    source: 'https://www.alibabacloud.com/product/cloud-shell'
  - product: 'Link IoT Edge'
    model: free
    reason: 'The product page states it is in public beta, free of charge.'
    source: 'https://www.alibabacloud.com/product/linkiotedge'
  - product: 'AnalyticDB'
    model: included
    reason: 'Umbrella of AnalyticDB for MySQL and AnalyticDB for PostgreSQL, each priced per engine.'
    source: 'https://www.alibabacloud.com/product/analyticdb'
  - product: 'ApsaraDB RDS'
    model: included
    reason: 'Umbrella of the RDS engines (MySQL, PostgreSQL, SQL Server, MariaDB), each priced per engine.'
    source: 'https://www.alibabacloud.com/product/apsaradb-rds'
  - product: 'PolarDB'
    model: included
    reason: 'Umbrella of PolarDB for MySQL, PolarDB for PostgreSQL and PolarDB-X, each priced per edition.'
    source: 'https://www.alibabacloud.com/product/polardb'
  - product: 'GameShield'
    model: included
    reason: 'The GameShield page now redirects to the Anti-DDoS product page. Its protection is priced as Anti-DDoS.'
