# The explanations of the "Rise drivers" analysis: the role legend and the warning board of the Analysis tab.
roles:
  - role: target
    title: Target
    symbol: "◎"
    summary: The measure of the rise to explain.
    details: >
      The analysis asks which criteria go with a higher target. Counts and amounts are compared as logarithms (a
      provider ten times larger counts once, not ten times), shares as they are. Pick an economic target (market share,
      revenue) for the market's verdict, or an ecosystem one (launches, listings, publishers) for the provider's own
      momentum.
  - role: criterion
    title: Criteria
    symbol: "◆"
    summary: The candidate drivers, ranked by how much of the target they explain.
    details: >
      Each criterion is correlated with the target (Spearman, with a 95% interval and a q-value correcting for the
      number of criteria tested), then regressed together with the others. Their share of the explained variance
      (Shapley split of the R²) ranks them. Keep about one criterion per 10 providers: beyond that the coefficients
      become unstable.
  - role: control
    title: Controls
    symbol: "▣"
    summary: Measures held constant, to see what a criterion adds beyond them.
    details: >
      A control (typically the catalogue size) is removed from both the criterion and the target before they are
      correlated again: the partial correlation (the diamond on the bars). A criterion whose correlation vanishes
      once size is held constant only reflects size. Controls are not ranked themselves.
  - role: scope
    title: Scope
    symbol: "⧗"
    summary: Which observations are compared.
    details: >
      Latest quarter compares the providers with each other (one observation per provider). Every quarter (panel)
      follows each provider over time: the yearly changes, with provider and quarter effects removing what is constant
      per provider and the market-wide trend. The panel answers "does a change of the criterion go with a later change
      of the target", and needs several quarters of crawls.
  - role: lag
    title: Lag
    symbol: "↦"
    summary: How many quarters the criteria lead the target (panel only).
    details: >
      With a lag of 2, the change of a criterion is compared with the change of the target two quarters later: an
      investment shows in the results later. The Granger p-value tests whether the criterion leads the target rather
      than follows it.
warnings:
  - kind: few-providers
    severity: caution
    title: Few providers measure the target
    meaning: >
      With 3 providers or fewer, any criterion that ranks them in the same order correlates perfectly: the
      analysis cannot tell a criterion from the identity of a provider.
    remedy: >
      Add the target of other providers in conf/metrics/manual-metrics.yaml (annual reports, analyst press
      releases), or pick an ecosystem target measured for every provider.
  - kind: few-observations
    severity: caution
    title: Few complete observations
    meaning: >
      Few observations hold the target and every criterion: one provider more or less can change the ranking.
    remedy: Choose criteria measured for more providers, or fewer criteria.
  - kind: missing-values
    severity: info
    title: Observations left out
    meaning: >
      Some observations miss a criterion. The correlations still use every pair available, but the regression only
      uses the observations holding them all.
    remedy: Drop the criteria measured least (named in the warning) to regress more observations.
  - kind: uncorrelatable
    severity: info
    title: Criterion not correlatable
    meaning: >
      The criterion has fewer than 3 observations with the target, or the same value everywhere: no correlation
      can be computed.
    remedy: Collect the criterion for more providers (CRAWLER_SOURCE=metrics, manual-metrics.yaml), or drop it.
  - kind: nothing-correlated
    severity: blocking
    title: Nothing to correlate
    meaning: No criterion can be correlated with the target, so nothing can be ranked.
    remedy: >
      For a panel, crawl regularly: a yearly change needs the same quarter a year earlier. Otherwise pick criteria
      measured for the providers measuring the target.
  - kind: left-out
    severity: info
    title: Criteria left out of the regression
    meaning: >
      These criteria could not be correlated with the target, so they are left out of the regression instead of
      shrinking it to the few observations holding them.
    remedy: Collect them for more providers, or drop them.
  - kind: constant
    severity: info
    title: Constant criteria
    meaning: >
      Over the observations of the regression these criteria take a single value: they cannot explain any
      difference, and are left out.
    remedy: Drop them, or widen the observations (more providers, every quarter).
  - kind: too-many-criteria
    severity: info
    title: Only the strongest criteria regressed
    meaning: >
      The Shapley split of the R² averages over every order of the criteria: it is limited to the 10 most correlated
      with the target. The others keep their correlation.
    remedy: Pick at most 10 criteria, ideally about one per 10 providers.
  - kind: regression-skipped
    severity: blocking
    title: No regression
    meaning: >
      There are too few observations for the number of criteria: a regression would fit them exactly and explain
      nothing. Only the correlations answer.
    remedy: Choose fewer criteria (at most observations minus 3).
  - kind: unstable
    severity: caution
    title: Unstable coefficients
    meaning: >
      With fewer than about 10 observations per criterion the coefficients move a lot from one sample to the next.
      The leave-one-out R² (each provider predicted by a model fitted without it) says how well the model
      generalizes.
    remedy: Trust the intervals and the leave-one-out R², or choose fewer criteria.
  - kind: collinear
    severity: caution
    title: Collinear criteria
    meaning: >
      These criteria move together (variance inflation above 10): the regression cannot tell which one acts, and
      their coefficients are unstable. Their shares of the R² remain fair: the Shapley split shares the overlap.
    remedy: Keep one of them, or hold the common factor constant as a control.
  - kind: short-panel
    severity: blocking
    title: Panel too short
    meaning: >
      A panel needs at least 2 providers over 2 quarters of yearly changes to remove the provider and quarter
      effects.
    remedy: Crawl the catalogues and marketplaces every week; after 2 to 4 quarters the panel can run.
columns:
  - column: criterion
    title: Criterion
    summary: The candidate driver of the rise.
    reading: The rows come ordered by share of R², the most predominant first. Click a header to sort by another figure.
  - column: importance
    title: Share of R²
    summary: >
      The part of the variance of the target this criterion explains, split fairly between the criteria (Shapley):
      the shares add up to the R².
    reading: >
      The higher, the more predominant. Compare it with the R² of the summary: 0.5 of an R² of 0.8 is 60% of what the
      criteria explain. "-" when the regression could not run.
  - column: beta
    title: β (std.)
    summary: >
      The standardized coefficient: by how many standard deviations the target moves when the criterion moves by
      one, the other criteria held fixed.
    reading: >
      Its sign gives the direction. Collinear criteria can show odd signs or sizes: trust their share of R² then.
  - column: beta-interval
    title: β 95% CI
    summary: The range holding the true coefficient 95 times out of 100.
    reading: When it straddles 0, even the direction of the effect is not established.
  - column: beta-p
    title: p (β)
    summary: How likely a coefficient this large would be if the criterion had no effect.
    reading: Below 0.05 it is unlikely to be chance. With few observations, read it together with the interval.
  - column: rho
    title: Spearman ρ
    summary: >
      The rank correlation of the criterion with the target, from -1 to +1, on its own (no other criterion held).
    reading: >
      Robust to outliers and to the size gaps between providers. * marks q < 5%, ** q < 1%.
  - column: rho-q
    title: q (ρ)
    summary: >
      The p-value of the correlation corrected for the number of criteria tested together (Benjamini-Hochberg).
    reading: >
      Below 0.05 the correlation is unlikely to be one of the false positives that testing many criteria produces.
  - column: partial
    title: Partial ρ
    summary: The correlation once the controls (e.g. the catalogue size) are held constant.
    reading: >
      When it falls near 0 while ρ is strong, the criterion only reflects the control. "-" without a control.
  - column: observations
    title: "N"
    summary: >
      The observations holding both the criterion and the target: providers, or provider-quarters in a panel.
    reading: Below about 10 the figures of the row are fragile.
  - column: granger
    title: Granger p
    summary: >
      Panel only: whether the past changes of the criterion predict the target beyond the target's own past. Tested
      for each correlated criterion, even when the regression could not run.
    reading: >
      Below 0.05 the criterion leads the target rather than follows it. "-" on the latest quarter, or when the
      criterion and the target lack a year of common history (the lags of both are needed).
