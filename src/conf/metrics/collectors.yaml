# Where the metric collectors (CRAWLER_SOURCE=metrics) find each provider.
# - cik: the SEC EDGAR filer of the group (companyfacts holds no segment, so the capex is the group's).
# - wikidata: the item of the provider (founding date P571, employees P1128).
# - asns: its autonomous systems at PeeringDB (internet exchanges and facilities).
# - repositories: its Terraform provider (and SDK) repositories at GitHub (stars).
# Secrets are never written here: only the names of the environment variables holding them.
user_agent: "poc-crawler/0.1 (cloud market research)"
# SEC EDGAR asks for a user agent naming a contact, e.g. "Company Name admin@company.example".
sec_user_agent_env: CRAWLER_SEC_USER_AGENT
github_token_env: GITHUB_TOKEN
# PeeringDB throttles the anonymous queries (HTTP 429): an API key (Api-Key header) lifts the limit.
peeringdb_key_env: PEERINGDB_API_KEY
capex_concepts:
  - PaymentsToAcquirePropertyPlantAndEquipment
  - PaymentsToAcquireProductiveAssets
