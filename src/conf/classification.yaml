# Rules classifying the catalogue products and the marketplace software into the unified taxonomy
# (`conf/taxonomy/taxonomy.yaml`, see `classifier.software_classifier`).
#
# The categories of an item are, in this order of precedence:
#   1. `name_rules`: well-known products, matched on the name (e.g. Odoo is an ERP whatever its labels).
#   2. When the source labels give more than 2 categories (over-ticked listings), the ones confirmed by
#      `keyword_rules` (matched on the name, else on the description), a keyword confirming a label category of the same
#      domain.
#   3. The categories of the source labels together with the `keyword_rules` categories of the name.
#   4. The `keyword_rules` categories of the description (within the domains of the labels when they only tell domains).
#   5. `delivery_categories`, for a software (e.g. a virtual machine image), then `other`.
# The categories of a source label are the links stored in the database: `category_rules` create them when a label is
# first seen, and a person (or the language model) may change them. A rule may give a domain instead of a category, when
# the label only tells the domain (e.g. `Compute`).
# The names are matched without their packaging suffix (`packaging_suffix`), e.g. `Grafana on Ubuntu 24.04` is matched
# as `Grafana`: the operating system (or hypervisor) it is packaged on does not make it an operating system, and
# `CVAT Virtual Machine` as `CVAT`.
# The audiences are those of the categories and domains (in the taxonomy), plus the `audience_hints` matched on the
# labels, else `delivery_audiences` (software) or `product_audiences` (catalogue products).
# The labels matching `noise_labels` (whole label) are not categories: they are ignored.
# Patterns are case-insensitive Python regular expressions. `\\b` does not separate Latin words from Chinese characters
# (both are word characters): `(?<![a-z])...(?![a-z])` is used instead around the short Latin words. Russian words are
# matched by their stem (`[а-я]*` for the endings).

delivery_audiences:
  saas: [end-user-software]
  one-click-app: [end-user-software]
  download: [end-user-software]
  virtual-machine: [developer-tool]
  container: [developer-tool]
  kubernetes: [developer-tool]
  api: [developer-tool]
  ai-model: [developer-tool]
  other: [end-user-software]

# A cloud catalogue product (compute, storage, databases...) of unknown audience is meant for the developers and IT teams.
product_audiences: [developer-tool]

# The categories of a software nothing else classifies, by how it is delivered.
delivery_categories:
  virtual-machine: [machine-images]
  container: [container]
  kubernetes: [kubernetes]
  one-click-app: [one-click-apps]
  ai-model: [ai-models]
  api: [sdks-apis]
  download: [software-licenses]

noise_labels:
  - "products?|services?|solutions?|offers?|other|others|misc(ellaneous)?|all|featured|popular|new|more|general|categories|catalog(ue)?"
  - "public cloud|cloud|cloud services|cloud products|cloud solutions|platform|platforms|infrastructure|enterprise"
  - "powered by .*|partner solutions|partner products|partners?|marketplace|free trial|free tier|top sellers|best sellers"
  - "in the russian software register|in the russian register.*|oracle cloud infrastructure|saas on oracle cloud platform"
  - "продукты|услуги|решения|другое|прочее|все|популярное|новинки|партн[её]рские решения|индивидуальные решения|базовые сервисы"
  - "其他|其它|全部|热门|推荐|产品|服务|解决方案|云产品|云服务"

packaging_suffix: "(?:\\s*(?:\\bon\\b|\\bover\\b|\\bwith\\b|\\||-|_)\\s*(?:ubuntu|debian|centos|windows|rhel|red hat|rocky|alma ?linux|suse|amazon linux|oracle linux|vmware)(?![a-z]).*|\\s+virtual machine)$"

audience_hints:
  - pattern: "developer|devops|development|开发|研发|运维|инструменты для разработки|разработчик"
    audiences: [developer-tool]
  - pattern: "business (software|applications?)|enterprise app|企业应用|企业经营|企业管理|企业服务|прикладное по|бизнес-приложен"
    audiences: [end-user-software]

