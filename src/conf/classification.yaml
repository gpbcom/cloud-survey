# Rules classifying the marketplace software into categories and types (see `classifier.software_classifier`).
#
# The types of a software are, in this order of precedence:
#   1. `name_rules`: well-known products, matched on the software name (e.g. Odoo is an ERP whatever its category).
#   2. When the marketplace categories give more than 2 types (`category_rules`, over-ticked listings), the ones
#      confirmed by `keyword_rules` (matched on the name, else on the description).
#   3. The `category_rules` types together with the `keyword_rules` types of the name: when they disagree, both are
#      usually partly right (e.g. an observability tool filed under development).
#   4. The `keyword_rules` types of the description.
#   5. Otherwise `other`.
# The names are matched without their packaging suffix (`packaging_suffix`), e.g. `Grafana on Ubuntu 24.04` is
# matched as `Grafana`: the operating system it is packaged on does not make it an operating system.
# Its categories are those of its types (`type_categories`), plus the `category_hints` matched on the marketplace
# categories. A software of type `other` only gets the category of its delivery method (`delivery_categories`).
# Patterns are case-insensitive Python regular expressions. `\\b` does not separate Latin words from Chinese characters
# (both are word characters): `(?<![a-z])...(?![a-z])` is used instead around the short Latin words.

type_categories:
  ats: [end-user-software]
  crm: [end-user-software]
  erp: [end-user-software]
  hris: [end-user-software]
  accounting: [end-user-software]
  ecommerce: [end-user-software]
  cms: [end-user-software]
  marketing: [end-user-software]
  customer-service: [end-user-software]
  collaboration: [end-user-software]
  communication: [end-user-software]
  project-management: [end-user-software]
  document-management: [end-user-software]
  business-intelligence: [end-user-software]
  supply-chain: [end-user-software]
  legal-compliance: [end-user-software]
  e-learning: [end-user-software]
  healthcare: [end-user-software]
  media: [end-user-software]
  itsm: [developer-tool]
  ai-ml: [developer-tool, end-user-software]
  database: [developer-tool]
  data-integration: [developer-tool]
  devops: [developer-tool]
  development: [developer-tool]
  low-code: [developer-tool, end-user-software]
  testing: [developer-tool]
  monitoring: [developer-tool]
  security: [developer-tool]
  identity: [developer-tool]
  backup: [developer-tool]
  storage: [developer-tool]
  networking: [developer-tool]
  operating-system: [developer-tool]
  container: [developer-tool]
  messaging: [developer-tool]
  api-management: [developer-tool]
  iot: [developer-tool]
  blockchain: [developer-tool]
  other: []

delivery_categories:
  saas: [end-user-software]
  one-click-app: [end-user-software]
  download: [end-user-software]
  virtual-machine: [developer-tool]
  container: [developer-tool]
  kubernetes: [developer-tool]
  api: [developer-tool]
  ai-model: [developer-tool]
  other: [end-user-software]

packaging_suffix: "\\s*(?:\\bon\\b|\\bover\\b|\\bwith\\b|\\||-|_)\\s*(?:ubuntu|debian|centos|windows|rhel|red hat|rocky|alma ?linux|suse|amazon linux|oracle linux)(?![a-z]).*$"

category_hints:
  - pattern: "developer|devops|development|开发|研发|运维"
    categories: [developer-tool]
  - pattern: "business (software|applications?)|enterprise app|企业应用|企业经营|企业管理|企业服务"
    categories: [end-user-software]

