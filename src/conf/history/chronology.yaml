reigns:
  # Mainframes.
  - segment: mainframes
    company: ibm
    start: "1964"
    share: "52% of US EDP revenue (1961), 50% (1968), 37% (1972, 1982); 73.8% of US mainframe sales (1983) [A]"
    criteria: [compatibility, profitability]
    rise: "System/360 (1964), a compatible family of machines with emulation of the older IBM lines [A]."
    fall: "Still leads mainframes; lost the wider industry to minicomputers, PCs and clouds; a loss of about $5bn in 1992 [B]."
    sources: ["Fisher, McKie & Mancke via Cato, 1985 [A]", "CMU 15-292 lecture notes [B]"]
  # Time-sharing.
  - segment: time-sharing
    company: tymshare
    start: "1966"
    end: "1984"
    share: "Leader with GE Information Services and Comshare; shares not available"
    criteria: [relative-advantage, profitability]
    rise: "Interactive computing by the hour, before computers were affordable to buy [K]."
    fall: "Displaced by minicomputers and PCs; sold to McDonnell Douglas in 1984 [K]."
    sources: ["Campbell-Kelly & Garcia-Swartz [K]"]
  # Minicomputers.
  - segment: minicomputers
    company: dec
    start: "1965"
    end: "1998"
    share: "No. 2 computer maker behind IBM in 1990, over $14bn revenue, more than 120,000 employees [A]"
    criteria: [relative-advantage, profitability]
    rise: "PDP and VAX: interactive departmental computing at a fraction of a mainframe's price [K]."
    fall: "Missed the PC and lost money in the 1990s; bought by Compaq for $9.6bn, announced 26 Jan 1998 [P]."
    sources: ["Britannica [A]", "DEC 8-K, 1998 [P]"]
  # Workstations and Unix.
  - segment: workstations
    company: apollo
    start: "1981"
    end: "1987"
    share: "Early workstation leader; shares not available"
    criteria: [compatibility]
    rise: "First networked engineering workstations [K]."
    fall: "Proprietary systems lost to open Unix workstations; acquired by HP in 1989 [K]."
    sources: ["Dossier §2.7 [Int]"]
  - segment: workstations
    company: sun
    start: "1987"
    end: "2001"
    share: "Workstation and Unix-server leader of the dot-com era; shares not available"
    criteria: [profitability]
    rise: "Open Unix workstations and servers, the network as the computer [K]."
    fall: "The dot-com crash plus Linux on x86 servers; bought by Oracle for $7.4bn in January 2010 [P]."
    sources: ["eWeek; Oracle 10-K FY2010 [P]"]
  - segment: workstations
    company: red-hat
    start: "2002"
    share: "Enterprise Linux subscriptions; acquired by IBM in 2019 [K]"
    criteria: [portability, profitability]
    rise: "Linux on cheap x86 servers, sold as supported subscriptions [Int]."
    fall: "Still leads enterprise Linux, inside IBM since 2019."
    sources: ["Dossier §2.7 [Int]"]
  # PC office software.
  - segment: office-software
    company: visicorp
    start: "1979"
    end: "1983"
    share: "VisiCalc, the first spreadsheet; shares not available"
    criteria: [profitability]
    rise: "VisiCalc made the personal computer a business tool [K]."
    fall: "A royalty dispute with Software Arts, then Lotus 1-2-3 [K]."
    sources: ["Campbell-Kelly, 2003 [K]"]
  - segment: office-software
    company: lotus
    start: "1983"
    end: "1993"
    share: "1-2-3, the leading spreadsheet on the IBM PC; shares not available"
    criteria: [relative-advantage, compatibility]
    rise: "1-2-3 on the IBM PC [K]."
    fall: "Late to Windows; bought by IBM for about $3.2-3.5bn in July 1995 [P]."
    sources: ["IBM 10-Qs, 1995 [P]"]
  - segment: office-software
    company: microsoft
    start: "1993"
    share: "Office on Windows; market cap $3.974tn on 9 Oct 2026 [B]"
    criteria: [compatibility, profitability]
    rise: "Office on Windows displaced 1-2-3 and WordPerfect, both late on Windows; the applications barrier to entry [P]."
    fall: "Still leads; EU and US antitrust cases changed timing, not direction."
    sources: ["US v. Microsoft, Findings of Fact, 1999 [P]"]
  # Databases.
  - segment: databases
    company: ashton-tate
    start: "1981"
    end: "1988"
    share: "dBase, the leading PC database; shares not available"
    criteria: [reliability]
    rise: "dBase II and III on early PCs [K]."
    fall: "Buggy dBase IV (1988); sold to Borland for about $440m in 1991 [P]."
    sources: ["DOJ Competitive Impact Statement, 1991 [P]"]
  - segment: databases
    company: oracle
    start: "1988"
    share: "Relational databases on every platform; a DORA critical provider [P]"
    criteria: [portability]
    rise: "The same relational database on every platform [Int]."
    fall: "Still leads enterprise databases."
    sources: ["Dossier §2.3 [Int]"]
  # PCs.
  - segment: pcs
    company: apple
    start: "1977"
    end: "1981"
    share: "Apple II era; shares not available"
    criteria: [relative-advantage]
    rise: "The Apple II and VisiCalc [K]."
    fall: "The IBM PC set the industry standard [K]."
    sources: ["Dossier §2.5 [Int]"]
  - segment: pcs
    company: ibm
    start: "1981"
    end: "1994"
    share: "About 26% of PCs worldwide in 1984 [B, weak]"
    criteria: [compatibility, profitability]
    rise: "An open, IBM-compatible design that set the standard [Int]."
    fall: "Clone makers matched it at lower cost; PC unit sold to Lenovo for $1.25bn in 2005 [J]."
    sources: ["Dataquest via 1985 transcript [B]", "China Daily; Forbes [J]"]
  - segment: pcs
    company: compaq
    start: "1994"
    end: "2002"
    share: "World's largest PC maker in the late 1990s [K]"
    criteria: [compatibility, profitability]
    rise: "The first IBM-compatible clones, then lower costs [Int]."
    fall: "Acquired by HP for about $25bn in stock, completed 3 May 2002 [P]."
    sources: ["HP 424B5, 2002 [P]"]
  - segment: pcs
    company: hp
    start: "2002"
    end: "2013"
    share: "Leader after the Compaq merger [K]"
    criteria: [profitability]
    rise: "Scale from the Compaq merger [K]."
    fall: "Overtaken by Lenovo's cost model [K]."
    sources: ["Dossier §2.5 [Int]"]
  - segment: pcs
    company: lenovo
    start: "2013"
    share: "24.9% of 284.7m PCs in 2025 (IDC), 27.2% (Gartner) [I]"
    criteria: [profitability]
    rise: "IBM's PC unit (2005) plus a low-cost manufacturing model [Int]."
    fall: "Still leads."
    sources: ["IDC via Thurrott [I]", "Gartner, Jan 2026 [I]"]
  # x86 CPUs.
  - segment: x86
    company: intel
    start: "1978"
    share: "69.3% of x86 PC and server units in Q2 2026, the lowest since 1995 (AMD 30.7%) [I]"
    criteria: [relative-advantage, compatibility]
    rise: "The 8086 family chosen for the IBM PC, then decades of process lead [K]."
    fall: "Still leads, but AMD reached 46.2% of x86 server revenue in Q1 2026 [I]."
    sources: ["Mercury Research via TechPowerUp, HotHardware [I]"]
  # Networking.
  - segment: networking
    company: novell
    start: "1983"
    end: "1995"
    share: "NetWare, the leading LAN operating system; shares not available"
    criteria: [compatibility]
    rise: "File and print sharing for PC networks [K]."
    fall: "Windows NT bundled networking [Int]."
    sources: ["Dossier §2.6 [Int]"]
  - segment: networking
    company: cisco
    start: "1995"
    share: "Router and switch leader; shares not available"
    criteria: [compatibility]
    rise: "Multiprotocol routers, then TCP/IP everywhere [Int]."
    fall: "Still leads enterprise networking."
    sources: ["Dossier §2.6 [Int]"]
  # Browsers.
  - segment: browsers
    company: netscape
    start: "1994"
    end: "1998"
    share: "Dominant browser of the early web; shares not available"
    criteria: [relative-advantage, profitability]
    rise: "Navigator, the first mainstream web browser [K]."
    fall: "Internet Explorer given away with Windows; sold to AOL for $4.2bn in 1998 [P]."
    sources: ["US v. Microsoft, Findings of Fact [P]", "AOL 8-K, 1998 [P]"]
  - segment: browsers
    company: microsoft
    start: "1998"
    end: "2012"
    share: "Internet Explorer; browser series not retrieved"
    criteria: [compatibility]
    rise: "Bundled with Windows [P]."
    fall: "Security problems, then Firefox and Chrome [Int]."
    sources: ["US v. Microsoft, Findings of Fact [P]"]
  - segment: browsers
    company: google
    start: "2012"
    share: "Chrome; browser series not retrieved"
    criteria: [relative-advantage]
    rise: "A faster browser, on every platform, with Google defaults [Int]."
    fall: "Still leads; the court denied a Chrome divestiture on 2 Sep 2025 [P]."
    sources: ["US v. Google remedies, 2025 [P]"]
  # Search.
  - segment: search
    company: yahoo
    start: "1995"
    end: "2002"
    share: "Leading web directory and portal; shares not available"
    criteria: [profitability]
    rise: "A human-edited directory of the early web [K]."
    fall: "Lost search to Google; sold to Verizon for $4.48bn in 2017, cut by $350m after its data breaches [P]."
    sources: ["Verizon 10-Q, 2017 [P]"]
  - segment: search
    company: google
    start: "2002"
    share: "89.9% of search worldwide, 85.2% in the US (Sep 2026); Yandex 70.3% in Russia, Baidu 59.1% in China [I/B]"
    criteria: [relative-advantage, profitability]
    rise: "PageRank, then paid default placements [P]."
    fall: "Still leads; liability found in US v. Google (2024), no divestiture (2025) [P]."
    sources: ["StatCounter via aggregators [I/B]", "US v. Google [P]"]
  # Smartphone OS.
  - segment: mobile
    company: nokia
    start: "2002"
    end: "2011"
    share: "Nokia 49.4% of smartphones (2007); Symbian 52.4% (2008), 46.9% (2009) [I]"
    criteria: [compatibility]
    rise: "The world's largest handset maker, Symbian smartphones [K]."
    fall: "Fragmented Symbian, then Windows Phone; devices sold to Microsoft for EUR 5.44bn in 2014 [P]."
    sources: ["Gartner via Fierce, TechCrunch [I]"]
  - segment: mobile
    company: google
    start: "2011"
    share: "Android; Kantar country shares not retrieved"
    criteria: [portability, compatibility]
    rise: "An open OS licensed to every handset maker [Int]."
    fall: "Still leads in units; the EU fined Android EUR 4.343bn in 2018 [K]."
    sources: ["Dossier §2.10 [Int]"]
  # Foundry.
  - segment: foundry
    company: tsmc
    start: "1987"
    share: "72.5% of foundry revenue in 2Q26, about $40.2bn [I]"
    criteria: [relative-advantage, reliability]
    rise: "The pure-play foundry model, then dependable leading-edge yields [Int]."
    fall: "Still leads; Samsung 5.9% and SMIC 5.4% in 2Q26 [I]."
    sources: ["TrendForce, Sep 2026 [I]"]
  # Accelerators.
  - segment: accelerators
    company: nvidia
    start: "2006"
    share: "Most valuable company, about $5.5tn (Oct 2026); first past $4tn and $5tn (2025) [B/J]"
    criteria: [compatibility, relative-advantage, profitability]
    rise: "CUDA (2006) made its GPUs the platform of AI [Int]."
    fall: "Still leads; US export controls and China's SAMR finding (2025) cap its China sales [P]."
    sources: ["finhacker.cz [B]", "Nvidia 10-Q [P]"]
  # Cloud infrastructure.
  - segment: cloud
    company: amazon
    start: "2006"
    share: "28% of a $143.4bn market in Q2 2026 (Microsoft 20%, Google 15%); 34% in Q2 2022 [I]"
    criteria: [relative-advantage, profitability]
    rise: "EC2 and S3 (2006), years ahead of competitors [Int]."
    fall: "Still leads, losing share to Microsoft and Google; UK share 30-40% (CMA, 2024) [P]."
    sources: ["Synergy Research via trade press [I]", "UK CMA, 31 Jul 2025 [P]"]
  # Frontier AI labs.
  - segment: ai-labs
    company: openai
    start: "2022-11"
    end: "2026-05"
    share: "Post-money $300bn (Mar 2025), $852bn (31 Mar 2026) [J]"
    criteria: [relative-advantage]
    rise: "ChatGPT (Nov 2022) [K]."
    fall: "Overtaken in private valuation by Anthropic in May 2026; talks at $1.4tn or more not closed [J]."
    sources: ["Reuters [J]", "RevenueMemo [B]"]
  - segment: ai-labs
    company: anthropic
    start: "2026-05"
    share: "Post-money $965bn (Series H, 28 May 2026); IPO discussed at $1.5-2tn (projection) [J/B]"
    criteria: [relative-advantage]
    rise: "Claude, with safety and reliability positioning [Int]."
    fall: "Leads by private valuation only; contested, pending the expected IPO."
    sources: ["Pinggy; ValueAddVC [B]", "Reuters via Quartz [J]"]

events:
  - {key: system-360, date: "1964-04-07", label: System/360 announced, kind: product, companies: [ibm], segment: mainframes, default: true,
     description: "IBM announces a compatible family of computers, the base of its mainframe dominance.", source: "IBM history [K]"}
  - {key: us-v-ibm-filed, date: "1969-01-17", label: US v. IBM filed, kind: regulation, companies: [ibm], segment: mainframes, outcome: timing-only, default: true,
     description: "The US Department of Justice sues IBM for monopolizing the computer market. Trial from 19 May 1975.", source: "historyofinformation.com [J]"}
  - {key: ibm-unbundling, date: "1969-06-23", label: IBM unbundles software, kind: regulation, companies: [ibm], segment: mainframes, outcome: structural, default: true,
     description: "IBM prices software, maintenance and education separately: the independent software market is born.", source: "IEEE ETHW; WSJ, 24 Jun 1969 [A/J]"}
  - {key: us-v-ibm-dropped, date: "1982-01-08", label: US v. IBM dropped, kind: regulation, companies: [ibm], segment: mainframes, outcome: timing-only, default: true,
     description: "The case is dropped as without merit after 13 years. IBM's EDP share had fallen from 50% to 37%, then stayed flat.", source: "historyofinformation.com [J]; Cato 1985 [A]"}
  - {key: att-decree, date: "1982-08", label: AT&T consent decree, kind: regulation, companies: [att], segment: workstations, outcome: structural, default: true,
     description: "The AT&T decrees (1956, 1982-84) kept Unix licences cheap and seeded the workstation industry.", source: "[K]"}
  - {key: tymshare-sold, date: "1984", label: Tymshare to McDonnell Douglas, kind: acquisition, companies: [tymshare, mcdonnell-douglas], segment: time-sharing, default: false,
     description: "The time-sharing leader is sold as minicomputers and PCs take over.", source: "[K]"}
  - {key: unisys-formed, date: "1986", label: Burroughs and Sperry form Unisys, kind: acquisition, companies: [unisys], segment: mainframes, default: false,
     description: "Two of the BUNCH merge. IDC had estimated the BUNCH would take less than $2bn of an $11.4bn mainframe market (1984).", source: "IDC via NYT [I/J]"}
  - {key: borland-ashton-tate, date: "1991-07-09", label: Borland buys Ashton-Tate, kind: acquisition, companies: [borland, ashton-tate], segment: databases, default: false,
     description: "A stock deal of about $440m after dBase IV's failure.", source: "DOJ Competitive Impact Statement [P]"}
