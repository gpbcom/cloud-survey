# Leaders of computing and digital infrastructure, 1964 to October 2026.
# Source: docs/analysis/sources/computing-leaders-1964-2026.md (the dossier). Every figure keeps the source tag of
# the dossier: [P] primary filing or regulator, [A] academic or business history, [I] industry analyst,
# [J] journalistic, [B] blog or aggregator, [K] established literature not re-verified, [Int] interpretation.
# Years the dossier does not date are taken from the literature and tagged [K].
# The Analysis tab draws the reigns as swimlanes and the events as dashed markers (the mega-trends policy-shock look).
# `uv run render-chronology` prints this file as docs/analysis/leaders-chronology.md.

as_of: "2026-10"

segments:
  - {key: mainframes, label: Mainframes, description: "Share of US EDP-industry or general-purpose computer revenue, as defined in US v. IBM."}
  - {key: time-sharing, label: Time-sharing, description: "Interactive computing sold by the hour on shared machines."}
  - {key: minicomputers, label: Minicomputers, description: "Departmental computers below mainframe price."}
  - {key: workstations, label: Workstations & Unix, description: "Technical workstations, then Unix and Linux servers."}
  - {key: office-software, label: PC office software, description: "Spreadsheets and office suites on personal computers."}
  - {key: databases, label: Databases, description: "Database software, from PC databases to relational servers."}
  - {key: pcs, label: PCs, description: "Personal computer unit shipments (IDC and Gartner definitions differ)."}
  - {key: x86, label: x86 CPUs, description: "x86 processor unit shipments, PC and server (Mercury Research)."}
  - {key: networking, label: Networking, description: "Local-area network software, then routers and switches."}
  - {key: browsers, label: Web browsers, description: "Share of browser usage."}
  - {key: search, label: Web navigation & search, description: "Share of search referrals (StatCounter page-view panel)."}
  - {key: mobile, label: Smartphone OS, description: "Smartphone operating systems, sales to end users (Gartner)."}
  - {key: foundry, label: Chip foundry, description: "Foundry revenue, top ten (TrendForce)."}
  - {key: accelerators, label: GPUs & AI accelerators, description: "Accelerated computing for graphics, then AI training and inference."}
  - {key: cloud, label: Cloud infrastructure, description: "Worldwide IaaS, PaaS and hosted private cloud revenue (Synergy Research)."}
  - {key: ai-labs, label: Frontier AI labs, description: "Leading frontier-model company, by post-money private valuation."}

