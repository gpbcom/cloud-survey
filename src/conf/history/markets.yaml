# Market shares and stock values of the leaders of the chronology (conf/history/chronology.yaml).
# Read by the markets crawl (CRAWLER_SOURCE=markets) and by the Analysis tab cards "Market shares" and "Stock values".
# Sources, licences and limits: docs/analysis/market-shares-and-stocks.md. Every company key is a chronology key.

# StatCounter Global Stats publishes monthly shares from 2009-01 (phone vendors from 2010-04, AI chatbots 2025-04).
statcounter_from: "2009-01"

# Google Finance's chart RPC (measured 2026-10-23, as in mega-trends' GoogleFinanceConfig). Google renames these
# without notice: change them here. The cookies only record a consent choice.
google_finance:
  rpc_id: c2u4wc
  period: 8
  consent_cookies:
    CONSENT: "YES+cb.20240101-00-p0.en+FX+000"
    SOCS: "CAESHAgBEhJnd3NfMjAyNDAxMDEtMF9SQzIaAmVuIAEaBgiA0t-tBg"

# The markets followed. The first device of a segment is the one its card opens on.
segments:
  - key: search
    label: Web search
    chronology: search
    source: statcounter
    stat: search_engine
    metric: usage
    devices: [all, desktop, mobile, tablet]
    description: "Share of the search referrals to the 1.5 million sites of the StatCounter panel (page views, not users or revenue)."
  - key: browsers
    label: Web browsers
    chronology: browsers
    source: statcounter
    stat: browser
    metric: usage
    devices: [all, desktop, mobile, tablet]
    description: "Share of the page views of the StatCounter panel, by browser."
  - key: operating-systems
    label: Operating systems
    chronology: mobile
    source: statcounter
    stat: os_combined
    metric: usage
    devices: [mobile, all, desktop, tablet]
    description: "Share of the page views of the StatCounter panel, by operating system (on phones: the smartphone OS)."
  - key: device-vendors
    label: Device vendors
    source: statcounter
    stat: vendor
    metric: usage
    devices: [mobile, tablet, all]
    description: "Share of the page views of the StatCounter panel, by phone or tablet vendor (installed base in use, not shipments)."
  - key: ai-chatbots
    label: AI chatbots
    chronology: ai-labs
    source: statcounter
    stat: ai_chatbot
    metric: usage
    devices: [all, desktop, mobile, tablet]
    first_month: "2025-04"
    description: "Share of the referrals from AI chatbots to the StatCounter panel (from April 2025)."
  - key: cloud
    label: Cloud infrastructure
    chronology: cloud
    source: synergy
    metric: revenue
    devices: [all]
    description: "Share of cloud infrastructure services revenue (IaaS, PaaS, hosted private cloud), Synergy Research Group, quarterly."

  - key: foundry
    label: Chip foundry
    chronology: foundry
    source: trendforce
    metric: revenue
    devices: [all]
    description: "Share of the revenue of the top 10 foundries, TrendForce, quarterly (the pure-play and IDM foundry businesses)."
  - key: dram
    label: DRAM
    source: trendforce
    metric: revenue
    devices: [all]
    description: "Share of DRAM revenue by supplier, TrendForce, quarterly."
  - key: nand
    label: NAND flash
    source: trendforce
    metric: revenue
    devices: [all]
    description: "Share of NAND flash revenue by supplier, TrendForce, quarterly."
  - key: pcs
    label: PCs
    chronology: pcs
    source: idc
    metric: units
    devices: [all]
    description: "Share of traditional PC shipments (desktops, notebooks, workstations; sell-in), IDC, quarterly."
  - key: smartphones
    label: Smartphones
    source: idc
    metric: units
    devices: [all]
    description: "Share of smartphone shipments (sell-in), IDC, quarterly."
  - key: tablets
    label: Tablets
    source: idc
    metric: units
    devices: [all]
    description: "Share of tablet shipments (sell-in), IDC, quarterly."

  - key: mainframes
    label: Mainframes & EDP industry
    chronology: mainframes
    source: manual
    metric: revenue
    devices: [all]
    description: "IBM's share of the US electronic data processing industry revenue (as defined in US v. IBM), of mainframe sales, and of computers worldwide (dossier points, 1961 to 1985)."
  - key: x86
    label: x86 CPUs
    chronology: x86
    source: manual
    metric: units
    devices: [all]
    description: "x86 processor unit shipments, PC and server (Mercury Research, dossier points)."
  - key: smartphone-os-sales
    label: Smartphone OS (sales)
    source: manual
    metric: units
    devices: [all]
    description: "Smartphone operating systems, sales to end users (Gartner, dossier points); StatCounter's operating systems are page views."

